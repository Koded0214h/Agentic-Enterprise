name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests
      run: |
        # Placeholder for running backend tests
        # Example: pytest ./app/tests/
        echo "Running backend tests... (Implement your test command here)"

    - name: Build Docker image (for verification)
      run: |
        docker build -t freelance-tracker-backend .
        echo "Docker image built successfully."
