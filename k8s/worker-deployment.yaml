apiVersion: apps/v1
kind: Deployment
metadata:
  name: aos-worker
  namespace: aos
  labels:
    app: aos-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aos-worker
  template:
    metadata:
      labels:
        app: aos-worker
    spec:
      containers:
        - name: worker
          image: aos-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["celery", "-A", "backend", "worker", "-l", "info", "-c", "4"]
          envFrom:
            - configMapRef:
                name: aos-config
            - secretRef:
                name: aos-secrets
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "4Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aos-beat
  namespace: aos
  labels:
    app: aos-beat
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aos-beat
  template:
    metadata:
      labels:
        app: aos-beat
    spec:
      containers:
        - name: beat
          image: aos-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - backend
            - beat
            - -l
            - info
            - --scheduler
            - django_celery_beat.schedulers:DatabaseScheduler
          envFrom:
            - configMapRef:
                name: aos-config
            - secretRef:
                name: aos-secrets
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
