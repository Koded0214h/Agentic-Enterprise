# IMPORTANT: Replace all <base64-encoded-value> placeholders before applying.
# Generate with:  echo -n "your-value" | base64
#
# Apply with:     kubectl apply -f k8s/secrets.yaml -n aos
#
apiVersion: v1
kind: Secret
metadata:
  name: aos-secrets
  namespace: aos
type: Opaque
data:
  DJANGO_SECRET_KEY: <base64-encoded-value>
  DATABASE_URL: <base64-encoded-value>          # postgres://user:pass@host:5432/db
  GEMINI_API_KEY: <base64-encoded-value>
  ANTHROPIC_API_KEY: <base64-encoded-value>
  OPENAI_API_KEY: <base64-encoded-value>
  MISTRAL_API_KEY: <base64-encoded-value>
  GOOGLE_CLIENT_ID: <base64-encoded-value>
  GITHUB_CLIENT_ID: <base64-encoded-value>
  GITHUB_CLIENT_SECRET: <base64-encoded-value>
  GRAFANA_PASSWORD: <base64-encoded-value>
